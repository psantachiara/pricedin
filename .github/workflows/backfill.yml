name: Backfill announcements

on:
  # Weekly, so the coverage strip keeps up without anyone remembering to run
  # it. Monday 06:00 UTC: the week being measured closed six hours earlier,
  # and nothing else is scheduled then -- the data job runs 12:45 and 22:30 on
  # weekdays and shares this concurrency group.
  #
  # Each run re-reads a trailing three weeks rather than just the week that
  # ended, because the Internet Archive crawls on its own schedule and a week
  # is usually thinly captured the moment it closes. write_coverage keeps the
  # better of the readings it already has, so measuring a week three times
  # can only improve it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: probe
        type: choice
        options:
          - probe
          - dry-run
          - run
          - undo
          - reclassify
          - reclassify-dry-run
      from:
        description: "Earliest date (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      to:
        description: "Latest date (YYYY-MM-DD, blank for today)"
        required: false
        default: ""
      per_day:
        description: "Snapshots to replay per day"
        required: false
        default: "2"
      feeds:
        description: "Feeds to use (comma-separated names, blank for all)"
        required: false
        default: ""
      workers:
        description: "Parallel archive requests"
        required: false
        default: "4"
      pause:
        description: "Seconds between archive requests, across all workers"
        required: false
        default: "1.5"
      reconsider_drops:
        description: "Re-examine items a previous run filtered out (needed after widening a rule)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "no tracked company in the headline"
          - "all"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # A scheduled run has no inputs, so it carries its own, and they are the
      # gentle ones: two workers three seconds apart took the share of
      # snapshots the archive refused from 28% to 6%. Four workers at 1.5s are
      # faster only on paper, because every refusal costs six retries at a
      # sixty-second timeout. Settings are resolved once here rather than
      # guarded at each use, and reach the shell through the environment
      # instead of being pasted into it.
      - name: Settings
        id: cfg
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_PER_DAY: ${{ inputs.per_day }}
          IN_FEEDS: ${{ inputs.feeds }}
          IN_WORKERS: ${{ inputs.workers }}
          IN_PAUSE: ${{ inputs.pause }}
          IN_RECON: ${{ inputs.reconsider_drops }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            MODE=run
            FROM=$(date -u -d '21 days ago' +%Y-%m-%d)
            TO=""
            PER_DAY=2
            FEEDS=""
            WORKERS=2
            PAUSE=3
            RECON=no
          else
            MODE="$IN_MODE"
            FROM="$IN_FROM"
            TO="$IN_TO"
            PER_DAY="$IN_PER_DAY"
            FEEDS="$IN_FEEDS"
            WORKERS="$IN_WORKERS"
            PAUSE="$IN_PAUSE"
            RECON="$IN_RECON"
          fi
          {
            echo "mode=$MODE"
            echo "from=$FROM"
            echo "to=$TO"
            echo "per_day=$PER_DAY"
            echo "feeds=$FEEDS"
            echo "workers=$WORKERS"
            echo "pause=$PAUSE"
            echo "recon=$RECON"
          } >> "$GITHUB_OUTPUT"
          echo "Triggered by $GITHUB_EVENT_NAME: mode=$MODE from=$FROM to=${TO:-today}" \
               "per_day=$PER_DAY workers=$WORKERS pause=$PAUSE"

      - name: Backfill
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ steps.cfg.outputs.mode }}
          FROM: ${{ steps.cfg.outputs.from }}
          TO: ${{ steps.cfg.outputs.to }}
          PER_DAY: ${{ steps.cfg.outputs.per_day }}
          FEEDS: ${{ steps.cfg.outputs.feeds }}
          WORKERS: ${{ steps.cfg.outputs.workers }}
          PAUSE: ${{ steps.cfg.outputs.pause }}
          RECON: ${{ steps.cfg.outputs.recon }}
        run: |
          # Built as arrays, and with `if` rather than `&&`: a trailing false
          # test would end the step, because the runner's shell exits on error.
          FEED_ARG=()
          if [ -n "$FEEDS" ]; then FEED_ARG=(--feeds "$FEEDS"); fi
          TO_ARG=()
          if [ -n "$TO" ]; then TO_ARG=(--to "$TO"); fi
          RECON_ARG=()
          if [ "$RECON" != "no" ]; then RECON_ARG=(--reconsider-drops "$RECON"); fi
          case "$MODE" in
            probe)   python scripts/backfill_news.py --probe --from "$FROM" \
                       --per-day "$PER_DAY" \
                       "${FEED_ARG[@]}" "${TO_ARG[@]}" ;;
            dry-run) python scripts/backfill_news.py --dry-run --report --from "$FROM" \
                       --per-day "$PER_DAY" --workers "$WORKERS" --pause "$PAUSE" \
                       "${RECON_ARG[@]}" "${FEED_ARG[@]}" "${TO_ARG[@]}" ;;
            run)     python scripts/backfill_news.py --from "$FROM" \
                       --per-day "$PER_DAY" --workers "$WORKERS" --pause "$PAUSE" \
                       "${RECON_ARG[@]}" "${FEED_ARG[@]}" "${TO_ARG[@]}" ;;
            undo)    python scripts/backfill_news.py --undo ;;
            reclassify)         python scripts/reclassify.py --report ;;
            reclassify-dry-run) python scripts/reclassify.py --dry-run --report ;;
          esac

      - name: Fetch prices and thumbnails
        if: >-
          steps.cfg.outputs.mode == 'run' ||
          steps.cfg.outputs.mode == 'undo' ||
          steps.cfg.outputs.mode == 'reclassify'
        run: python scripts/update_data.py

      - name: Commit updated data
        if: >-
          steps.cfg.outputs.mode == 'run' ||
          steps.cfg.outputs.mode == 'undo' ||
          steps.cfg.outputs.mode == 'reclassify'
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/thumbnails.json data/events.json \
                  data/news_seen.json data/coverage.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data: $MODE ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
