name: Code framing with a language model

# Two phases, run one after the other in a single job. The coding phase appends
# to data/llm_codes.jsonl and skips ids already there, so a run that hits the
# timeout can simply be dispatched again and will pick up where it stopped.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        required: true
        default: claude-sonnet-5-5
        type: choice
        options:
          - claude-sonnet-5-5
          - claude-haiku-5-5
          - claude-opus-5
      scope:
        description: "Which items"
        required: true
        default: all
        type: choice
        options:
          - all
          - sample
      limit:
        description: "Stop after this many items (blank for no limit)"
        required: false
        default: ""
      apply:
        description: "Write the codes into events.json when the run finishes"
        required: false
        default: true
        type: boolean
      redo:
        description: "Re-code items already coded (needed after a rubric change)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Report what would be sent, call nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check the key is present
        if: inputs.dry_run != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Key present (${#ANTHROPIC_API_KEY} characters)."

      - name: Snapshot the keyword baseline and stamp the hand codes
        run: python scripts/prepare_codes.py

      - name: Code
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--model ${{ inputs.model }} --scope ${{ inputs.scope }}"
          if [ "${{ inputs.scope }}" = "sample" ]; then
            ARGS="$ARGS --sample-file data/sample.json"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.redo }}" = "true" ]; then ARGS="$ARGS --redo"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/code_frames.py code $ARGS

      - name: Apply to events.json
        if: inputs.dry_run != true && inputs.apply == true
        run: python scripts/code_frames.py apply

      - name: Compare against the reference codes
        if: inputs.dry_run != true
        run: python scripts/compare_coders.py || true

      - name: Rebuild coverage and derived data
        if: inputs.dry_run != true && inputs.apply == true
        run: python scripts/update_data.py

      - name: Commit
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/llm_codes.jsonl data/keyword_codes.jsonl \
                  data/coverage.json data/prices.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Code framing with ${{ inputs.model }}"
            git pull --rebase
            git push
          fi
