name: Fetch from publisher APIs

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which publisher"
        required: true
        default: both
        type: choice
        options:
          - both
          - nyt
          - guardian
      from:
        description: "Earliest date (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      to:
        description: "Latest date (YYYY-MM-DD, blank for today)"
        required: false
        default: ""
      dry_run:
        description: "Report without writing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch
        env:
          PYTHONUNBUFFERED: "1"
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          TO=""
          if [ -n "${{ inputs.to }}" ]; then TO='--to'; fi
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY='--dry-run'; fi
          python scripts/fetch_api.py --source "${{ inputs.source }}" \
            --from "${{ inputs.from }}" $TO ${TO:+"${{ inputs.to }}"} --report $DRY

      - name: Fetch prices and thumbnails
        if: inputs.dry_run != true
        run: python scripts/update_data.py

      - name: Commit updated data
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/thumbnails.json data/events.json \
                  data/news_seen.json data/coverage.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Fetch from ${{ inputs.source }} ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
